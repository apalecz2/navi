# navi plus its two sidecars. Prometheus and Grafana are not components: nothing
# in the fire path reads them, scraping is pull-based so a dead Prometheus cannot
# block the app, and if both die every reminder still fires (D-023).
#
# cloudflared already runs on this host and is not defined here. See
# ops/cloudflared-ingress.md for the ingress rule and the network it needs to
# share.

services:
  navi:
    build: .
    image: navi:latest
    container_name: navi
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8000"
      DATA_DIR: /data
      # Explicit rather than left to Go's internal DBPath() default, because
      # litestream.yml (baked into the image) reads this same variable
      # straight from the environment — it has no access to Go's resolved
      # value. One explicit source is what makes the two agree by
      # construction instead of by two defaults happening to match.
      DATABASE_PATH: /data/navi.db
      # No default, here or in the code: the schedule machinery resolves against
      # this zone and a wrong guess is invisible until a DST boundary.
      DEFAULT_TZ: ${DEFAULT_TZ:?DEFAULT_TZ must be set, e.g. America/Toronto}
      CONFIG_DIR: /config
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Which adapter delivers reminders. Named explicitly rather than left to
      # the code's default, because that default is "logging" — a container that
      # inherited it would tick, claim rows, mark them notified, report healthy,
      # and never reach a phone. The service warns every boot when it is in
      # force; this line is what makes the choice deliberate.
      NOTIFY_TRANSPORT: ${NOTIFY_TRANSPORT:-logging}
      CHAT_TRANSPORT: ${CHAT_TRANSPORT:-}
      # Only actually required when NOTIFY_TRANSPORT and/or CHAT_TRANSPORT
      # names telegram — config.Load does that gating, not compose, so these
      # stay soft-defaulted here the same way CHAT_TRANSPORT does.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ALLOWED_SENDER_ID: ${ALLOWED_SENDER_ID:-}
      # Required only when CHAT_TRANSPORT=telegram (session 8, P1): the whole
      # authentication mechanism for /webhook/telegram, since Telegram has no
      # session to put behind Cloudflare Access.
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Which upstream the model client talks to — "openrouter" (default) or
      # "gemini". config.Load fails the boot on an unknown value, and fails
      # it again if config/model.yaml's base_urls don't match this choice
      # (internal/model.ValidateProvider).
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openrouter}
      # Required only when CHAT_TRANSPORT=telegram (session 11) and
      # MODEL_PROVIDER=openrouter (the default): the conversation loop's
      # model client. config.Load does the gating, not compose, so this
      # stays soft-defaulted here the same way the other Chat-only variables
      # above do.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Required only when CHAT_TRANSPORT=telegram and MODEL_PROVIDER=gemini.
      # Same soft-default shape as OPENROUTER_API_KEY above.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Litestream (session 7) reads these directly — they never reach Go's
      # config package, see internal/config/config.go. D4 is a Must and has no
      # honest default to fall back to silently, so unlike NOTIFY_TRANSPORT
      # this is a hard boot failure rather than a soft one when unset.
      # ENDPOINT/ACCESS_KEY_ID/SECRET_ACCESS_KEY are needed for s3:// replicas
      # (R2 is S3-compatible but not at an AWS endpoint) and ignored for a
      # file:// replica.
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:?LITESTREAM_REPLICA_URL must be set, e.g. s3://bucket/navi or file:///backup/navi}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      # Local disk only. SQLite locking is unreliable over NFS and SMB (D3).
      # The container runs as uid 65532, so: mkdir -p data && sudo chown 65532:65532 data
      - ./data:/data
      # Read-only, and it shadows the copy baked into the image. Editing the
      # vocabulary table needs a restart but not a rebuild (D-016); persona.md
      # lands beside it in P5 and needs neither (G5).
      - ./config:/config:ro
    ports:
      # Loopback only. Everything reachable from outside this host arrives
      # through the tunnel.
      - "127.0.0.1:8000:8000"
    networks:
      - navi

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: navi-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - navi
    depends_on:
      - navi

  grafana:
    image: grafana/grafana:11.4.0
    container_name: navi-grafana
    restart: unless-stopped
    environment:
      # Same rule as the application's own secrets: nothing that authorizes gets
      # a default value (D9).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - navi
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  navi:
    name: navi
