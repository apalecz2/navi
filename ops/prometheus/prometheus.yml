# Scrapes the container network only. /metrics is deliberately absent from the
# tunnel ingress table: it carries no secrets, but it describes usage patterns in
# detail and has no reason to leave the host.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: navi
    static_configs:
      - targets: ["navi:8000"]

  # Litestream (session 7) runs as navi's container entrypoint, in the same
  # container, so its metrics live on the same network target at a different
  # port. This is what makes "R2 unreachable" a dashboard fact instead of
  # only something found by reading logs.
  - job_name: litestream
    static_configs:
      - targets: ["navi:9200"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
