# Model routing. Transcribed from docs/06-agent-spec.md#model-routing, which is
# the source of truth for the table; this file is the source of truth for the
# running process (L1: model choice is configuration, not code).
#
# Every tier here points at Google's own OpenAI-compatible endpoint
# (MODEL_PROVIDER=gemini in internal/config), so base_url is the same across
# every entry today — it stays per-tier rather than a single top-level value
# because a future tier hitting a different backend is a config edit, not a
# code change. The key itself is never in this file (D9/D10): it comes from
# GOOGLE_API_KEY. internal/model.ValidateProvider checks every base_url below
# actually agrees with MODEL_PROVIDER at boot, so an edit here that misses a
# tier (or a MODEL_PROVIDER flip that isn't paired with an edit here) fails
# loudly instead of sending the key to the wrong host.
#
# The model ids below are Google's own naming — no "google/" prefix, unlike
# OpenRouter's, and Gemma needs the "-it" (instruction-tuned) suffix Google's
# own model listing uses that OpenRouter's naming drops. Verified for real
# against a live GOOGLE_API_KEY (2026-08-11): GET .../v1beta/openai/models
# confirmed every id below resolves, and a real Complete() round trip
# (single-turn tool call, then that same call replayed into a second turn's
# history, ToolCall.Extra intact) succeeded end to end.
#
# thinking: true is off for every task here, deliberately, unlike the
# OpenRouter version of this file. internal/model's Reasoning field
# (wire.go) is OpenRouter's own unified switch for thinking mode
# ("reasoning": {"enabled": true}) — Google's OpenAI-compatible endpoint does
# strict schema validation and 400s the whole request on it ("Unknown name
# \"reasoning\": Cannot find field", confirmed against a real key). Thinking
# is documented as best-effort and not load-bearing (internal/model/routing.go),
# so turning it off here costs nothing functional; flip it back to true only
# if this file is ever pointed at a provider whose OpenAI-compat layer
# actually accepts that field.
#
# Mounted read-only at /config, same as defaults.yaml: retuning the ladder is a
# restart, not a rebuild.

tasks:
  crud:
    thinking: false
    tiers:
      - model: "gemma-4-31b-it"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 120
      - model: "gemini-3.5-flash-lite"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 130

  bulk_resolve:
    thinking: false
    tiers:
      - model: "gemma-4-31b-it"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 120
      - model: "gemini-3.5-flash-lite"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 130

  # No tier 2 (docs/06-agent-spec.md#model-routing): escalating a task whose
  # failure mode is already acceptable — the plain-title fallback — spends
  # money to avoid an outcome that is fine. Tier 1's timeout is the shortest
  # of the five: the copywriter's whole failure story is giving up in time for
  # the scheduler to send that plain title anyway.
  copywriter:
    thinking: false
    tiers:
      - model: "gemma-4-31b-it"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 120

  reconcile:
    thinking: false
    tiers:
      - model: "gemma-4-31b-it"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 120
      - model: "gemini-3.5-flash-lite"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 130

  # Same shape as reconcile (docs/06-agent-spec.md#model-routing): composing one
  # message from a list, not reasoning over it. Fires once a day, ~30 minutes
  # ahead of BRIEFING_AT, and falls back to a plain template on any failure, so
  # the second tier is a courtesy rather than a necessity.
  briefing:
    thinking: false
    tiers:
      - model: "gemma-4-31b-it"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 120
      - model: "gemini-3.5-flash-lite"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 130

  # Weekly, and it actually reasons over statistics, so cost is negligible at
  # that frequency and both tiers get more time than the others.
  digest:
    thinking: false
    tiers:
      - model: "gemini-3.6-flash"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 145
      - model: "gemini-3.5-flash-lite"
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        timeout_seconds: 160
